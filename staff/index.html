<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Crew | KCVA</title>
  <meta name="description" content="Meet the eleven students and event staff behind KCVA.">
  <link rel="canonical" href="https://kcva.com.cn/staff/">
  <link rel="icon" href="/assets/brand/kcva-emblem-white.png">
  <link rel="stylesheet" href="/styles/site.css">
  <script type="module" src="/scripts/site.js"></script>
</head>
<body>
  <div data-site-header></div>
  <main id="main">
    <header class="page-hero crew-page-hero">
      <div class="container">
        <p class="eyebrow" data-en="MEET THE TEAM" data-zh="认识团队">MEET THE TEAM</p>
        <h1 class="display">KCVA CREW.</h1>
        <p class="body-copy" data-en="The people behind every serve, save and event day." data-zh="每一次发球、救球与比赛日背后的团队。">The people behind every serve, save and event day.</p>
      </div>
    </header>
    <section class="page-body crew-page-body">
      <div class="container">
        <div class="staff-tools">
          <label class="visually-hidden" for="staff-search">Search staff</label>
          <input id="staff-search" data-staff-search type="search" placeholder="Search staff / 搜索团队成员">
        </div>
        <div class="staff-grid" data-staff-grid></div>
      </div>
    </section>
  </main>
  <dialog class="staff-dialog" id="staff-dialog">
    <button class="lightbox-close" aria-label="Close">×</button>
    <div class="staff-modal">
      <div class="staff-modal-photo"></div>
      <div class="staff-modal-copy"><h2></h2><h3></h3><p></p></div>
    </div>
  </dialog>
  <div data-sponsors></div>
  <div data-site-footer></div>
</body>
</html>
